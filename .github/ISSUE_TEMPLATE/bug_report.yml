name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste diary data or screenshots of it.** Describe the problem with made-up entries.
        Security problems go to hello@n1naplo.org (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (with made-up data)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone, OS version, app version (Settings › About)
    validations:
      required: true
