name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kapu: typecheck + lint + tesztek (forni-minta).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Lint & format
        run: npx biome check src/
      - name: Tests
        run: npx vitest run
      - name: Ethics check
        run: node scripts/ethics-check.mjs

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Sync Capacitor (Android)
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: No-INTERNET guard
        # Core promise: fails if any plugin merges INTERNET back.
        run: |
          test -f android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          ! grep -Rq "android.permission.INTERNET" android/app/build/intermediates/merged_manifests/
      - name: Backup-rules guard
        # The manifest must point at the rules ethics-check guards.
        run: |
          m=android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' "$m"
          grep -q 'android:fullBackupContent="@xml/backup_rules"' "$m"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: n1naplo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
